<!DOCTYPE html>
<html lang="en">
<head>
    <title>Weather API Example</title>

    <head>
  <title>Weather API Example</title>

  <style>
    body {
      background-color: #C98F8F;
      font-family: 'Times New Roman', Times, serif;
      color: #2b1a10;
    }
    
     * {
    font-family: 'Times New Roman', Times, serif !important;
  }
  </style>

</head>
</head>
<body>
    <h2>Weather Checker</h2>
    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>
    <p id="weatherResult"></p>
 
    <script>
        function getWeather() {
            let city = document.getElementById("city").value;
            let apiKey = "130ffc9d3e17dbca9f154532ab15e933"; // Replace with your OpenWeatherMap API key
            let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
 
            fetch(url)
               .then(response => response.json())
                .then(data => {
                    document.getElementById("weatherResult").innerHTML = `
                    <p>Temperature: ${data.main.temp}°C</p>
                    <img src="https://openweathermap.org/img/w/${data.weather[0].icon}.png">
                    <p>${data.weather[0].description}</p>
                    `;
                })
                .catch(error => console.error("Error fetching weather data:", error));
        }
    </script>
     <footer style="background-color: #5a2e2e; color: #ffffff; padding: 15px; text-align: center; margin-top: 30px;">
            <p>&copy; Xoxo Elle.</p>
        </footer>
</body>
</html>
