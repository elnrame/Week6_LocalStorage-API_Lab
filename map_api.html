<!DOCTYPE html>
<html lang="en">
<head>
    <title>Google Maps API Example</title>
    <style>
  body {
    background-color: #A67C66;
    font-family: 'Times New Roman', Times, serif;
  }

  * {
    font-family: 'Times New Roman', Times, serif !important;
  }
</style>
    <script>
            function searchLocation() {
            let location = document.getElementById("locationInput").value;
            let geocoder = new google.maps.Geocoder();
            
            geocoder.geocode({ 'address': location }, function(results, status) {
                if (status == 'OK'){
                    let map = new google.maps.Map(document.getElementById("map"), {
                        zoom: 10,
                        center: results[0].geometry.location
                    });
                } else {
                alert("Location not found!");
                }
            });
        }
    </script>
</head>
<body>
    <h2>Google Maps Integration</h2>
    <input type="text" id="locationInput" placeholder="Enter a location"><br>
    <button onclick="searchLocation()">Search</button>


    <div id="map" style="height:400px; width:100%;"></div>
 
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAhk1EKCtnwyg8cf_hcrOlEJodp6jly8a4&callback=initMap"></script>
    <footer style="background-color: #5a2e2e; color: #ffffff; padding: 15px; text-align: center; margin-top: 30px;">
            <p>&copy; Xoxo Elle.</p>
        </footer>
</body>
</html>
